<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found · Arjungopal Anilkumar</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="512x512" href="./favicon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #161819;
            --bg-card: #1d2022;
            --border: #2c3133;
            --text: #f0f0f0;
            --text-muted: rgba(240,240,240,.65);
            --accent: #d27878;
            --hf: 'Raleway', sans-serif;
            --bf: 'DM Sans', sans-serif;
        }

        html, body {
            height: 100%;
            height: 100svh;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--bf);
            font-weight: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
        }

        /* ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -20vh; left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(210,120,120,.12) 0%, transparent 65%);
            pointer-events: none;
            filter: blur(60px);
        }

        .error-code {
            font-family: var(--hf);
            font-size: clamp(6rem, 20vw, 11rem);
            font-weight: 700;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 2px var(--border);
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            position: relative;
        }

        /* accent dot on the 0 */
        .error-code span {
            color: var(--accent);
            -webkit-text-stroke: 0;
        }

        .error-title {
            font-family: var(--hf);
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 600;
            margin-bottom: 0.7rem;
        }

        .error-sub {
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 380px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: var(--hf);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            padding: 10px 22px;
            border: 1px solid var(--border);
            border-radius: 3px;
            transition: border-color .25s, background .25s;
        }

        .btn:hover {
            border-color: var(--accent);
            background: rgba(210,120,120,.1);
        }

        .btn.filled {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn.filled:hover {
            background: #e08e8e;
            border-color: #e08e8e;
        }
    </style>
</head>
<body>
    <p class="error-code">4<span>0</span>4</p>
    <h1 class="error-title">Page not found.</h1>
    <p class="error-sub">The page you're looking for doesn't exist or may have been moved. Head back home and explore from there.</p>
    <div class="btn-group">
        <a href="/" class="btn filled">↑ Back to Home</a>
        <a href="mailto:arjungopal660@gmail.com" class="btn">Get in Touch</a>
    </div>
</body>
</html>
